# Perfil de tests: base H2 en memoria en modo PostgreSQL. Flyway corre las mismas migraciones.
spring:
  datasource:
    url: jdbc:h2:mem:actividades;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
