server:
  port: 8082

spring:
  application:
    name: ms-clases
  datasource:
    url: jdbc:postgresql://localhost:5432/clases_db
    username: ${CLASES_DB_USER:clases_user}
    password: ${CLASES_DB_PASSWORD:clases_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/climafit
          jwk-set-uri: http://localhost:8090/realms/climafit/protocol/openid-connect/certs

climafit:
  clientes:
    actividades-url: http://localhost:8081
    notificaciones-url: http://localhost:8084

---
# Dentro de la red de Docker Compose (puertos de la Fase 0, punto 3)
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/clases_db
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/climafit/protocol/openid-connect/certs

climafit:
  clientes:
    actividades-url: http://ms-actividades:8081
    notificaciones-url: http://ms-notificaciones:8084
