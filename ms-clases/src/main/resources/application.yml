# Los valores por defecto (después de ":") sirven para correr desde el IDE contra los
# contenedores de infraestructura (docker compose up -d postgres keycloak).
# En Docker Compose se pisan con variables de entorno.
server:
  # 8080 dentro del contenedor; desde el IDE se usa otro puerto para no chocar con el gateway.
  port: ${SERVER_PORT:8082}
  # Detrás del gateway: usa los headers X-Forwarded-* para armar URLs públicas (ej. el header Location).
  forward-headers-strategy: framework

spring:
  application:
    name: ms-clases
  web:
    # Mensajes de validación en español ("debe ser menor que o igual a 100")
    locale: es_AR
    locale-resolver: fixed
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clases_db}
    username: ${DB_USER:clases}
    password: ${DB_PASSWORD:clases}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea Flyway (src/main/resources/db/migration). Hibernate solo valida que coincida.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: America/Argentina/Cordoba
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri valida el claim "iss"; jwk-set-uri es de dónde se bajan las claves públicas.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/climafit}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8090/realms/climafit/protocol/openid-connect/certs}
      client:
        registration:
          climafit-servicios:
            provider: climafit-servicios
            client-id: climafit-servicios
            client-secret: ${CLIENTE_SERVICIOS_SECRET:}
            authorization-grant-type: client_credentials
        provider:
          climafit-servicios:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://keycloak:8080/realms/climafit/protocol/openid-connect/token}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    # Cada línea de log incluye el correlation id de la solicitud (lo pone climafit-commons).
    level: "%5p [${spring.application.name},%X{correlationId:-}]"

springdoc:
  api-docs:
    path: /v3/api-docs

climafit:
  clients:
    clima-url: ${MS_CLIMA_URL:http://ms-clima:8080}
  evaluacion:
    programada: true
    intervalo: PT3H
    retraso-inicial: PT1M
