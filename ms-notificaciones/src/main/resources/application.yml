# Los valores por defecto (después de ":") sirven para correr desde el IDE contra los
# contenedores de infraestructura (docker compose up -d postgres keycloak).
# En Docker Compose se pisan con variables de entorno.
server:
  # 8080 dentro del contenedor; desde el IDE se usa otro puerto para no chocar con el gateway.
  port: ${SERVER_PORT:8084}
  # Detrás del gateway: usa los headers X-Forwarded-* para armar URLs públicas (ej. el header Location).
  forward-headers-strategy: framework

spring:
  application:
    name: ms-notificaciones
  web:
    # Mensajes de validación en español ("debe ser menor que o igual a 100")
    locale: es_AR
    locale-resolver: fixed
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notificaciones_db}
    username: ${DB_USER:notificaciones}
    password: ${DB_PASSWORD:notificaciones}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea Flyway (src/main/resources/db/migration). Hibernate solo valida que coincida.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: America/Argentina/Cordoba
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri valida el claim "iss"; jwk-set-uri es de dónde se bajan las claves públicas.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/climafit}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8090/realms/climafit/protocol/openid-connect/certs}

  task:
    execution:
      # Pool de hilos de @Async: los envíos por Telegram corren acá, no en el hilo de la solicitud.
      thread-name-prefix: envio-
      pool:
        core-size: 4
        max-size: 8
    scheduling:
      # Dos tareas periódicas: la recuperación de pendientes y la lectura de mensajes del bot.
      # Con un solo hilo, una recuperación con reintentos demoraría la vinculación.
      pool:
        size: 2

climafit:
  telegram:
    # "log" (demo: solo escribe el mensaje en el log) o "bot" (envío real con la Bot API de Telegram).
    proveedor: ${TELEGRAM_PROVEEDOR:log}
    # RN16: intentos totales por notificación y espera antes del 2.º intento (después se duplica: 1 s, 2 s...).
    max-intentos: 3
    espera-inicial: PT1S
    bot:
      url: https://api.telegram.org
      # Token que entrega @BotFather. Es un secreto: va solo en el .env, nunca en el código.
      token: ${TELEGRAM_BOT_TOKEN:}
    vinculacion:
      # Cuánto dura el link de vinculación y cada cuánto se leen los mensajes del bot (solo con "bot").
      vigencia: PT24H
      cada: PT3S
  notificaciones:
    # Cada cuánto se buscan notificaciones PENDIENTE colgadas, y qué antigüedad deben tener.
    recuperacion-cada: PT5M
    pendientes-antiguedad: PT5M

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    # Cada línea de log incluye el correlation id de la solicitud (lo pone climafit-commons).
    level: "%5p [${spring.application.name},%X{correlationId:-}]"

springdoc:
  api-docs:
    path: /v3/api-docs
